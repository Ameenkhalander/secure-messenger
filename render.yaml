# Render Blueprint: New + > Blueprint, pick this repo.
services:
  - type: web
    name: sealed-messenger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --timeout 120 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: sealed-db
          property: connectionString
databases:
  - name: sealed-db
    plan: free
